version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: purchase_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - purchase_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: purchase_backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
    expose:
      - "3333"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - purchase_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: purchase_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - purchase_network

  nginx:
    image: nginx:1.27-alpine
    container_name: purchase_nginx
    restart: always
    ports:
      - "0.0.0.0:${FRONTEND_PORT}:80"
      - "0.0.0.0:${HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - backend_uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://127.0.0.1:443"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - purchase_network

networks:
  purchase_network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
